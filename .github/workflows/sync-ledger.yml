# Hourly one-way copy of the old ledger (Apps Script + Sheet) into Supabase, until the new app takes over.
# Read-only on the old side: it only GETs the old ledger's public answer and checks out the old repo for player names.
# Also keeps the free Supabase project from pausing after a week without activity.
name: Sync ledger from old system
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rizkyekoputra/rok-3514
          path: old/rok-3514
          sparse-checkout: tracker
      - run: python3 scripts/import/import_ledger.py --write
        env:
          OLD_REPO: old/rok-3514
          OLD_LEDGER_URL: ${{ vars.OLD_LEDGER_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
