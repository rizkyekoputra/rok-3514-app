# New dashboard on GitHub Pages: rebuilt hourly from the old published dashboard (read-only) into site/index.html +
# site/data.json, with the ledger served live by Supabase. Nothing is committed; the site is a Pages artifact.
name: Dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/web/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
