# Hourly public ledger snapshot: commits data/ledger_public.json only when it changes, which rebuilds Pages.
# Keeps ordinary dashboard visitors from downloading the full ledger from Supabase on every page view.
name: Ledger snapshot
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/web/snapshot_ledger.py
      - name: Commit only when the ledger changed
        run: |
          git add data/ledger_public.json
          if git diff --cached --quiet; then echo 'no ledger changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ledger snapshot: hourly public ledger'
          git pull --rebase origin main && git push
